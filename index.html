<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adoración Santuario Baigorria</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Manifiesto PWA Inyectado Dinámicamente para que sea un solo archivo -->
  <link id="pwaManifest" rel="manifest" href="">

  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a 50%, #020617 100%);
      color: #f8fafc; 
      margin: 0; 
      padding-bottom: 95px; 
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .chord { 
      font-weight: 800; 
      color: #38bdf8; 
      font-family: monospace; 
      background: rgba(56, 189, 248, 0.15); 
      padding: 2px 6px; 
      border-radius: 6px; 
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- Header -->
  <header class="bg-slate-900/80 backdrop-blur-md border-b border-white/10 sticky top-0 z-50 px-4 py-3.5 flex justify-between items-center shadow-2xl">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-gradient-to-tr from-indigo-600 to-blue-500 rounded-xl flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
        🎵
      </div>
      <div>
        <h1 class="text-sm font-extrabold tracking-wider text-white uppercase leading-tight">ADORACION SANTUARIO BAIGORRIA</h1>
        <p class="text-[11px] text-indigo-300 font-medium">Ministerio de Alabanza</p>
      </div>
    </div>
    <div id="headerTitle" class="text-xs font-bold bg-indigo-500/20 text-indigo-300 px-2.5 py-1 rounded-full border border-indigo-500/30">
      Cronograma
    </div>
  </header>

  <!-- Contenido -->
  <main class="max-w-md mx-auto p-4">

    <!-- PANTALLA 1: CRONOGRAMA -->
    <div id="screenSchedule" class="space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold tracking-tight text-white">Cronograma de Servicio</h2>
        <span class="text-xs bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-3 py-1 rounded-full font-semibold">Noviembre</span>
      </div>

      <div class="glass-card rounded-3xl p-5 space-y-4 shadow-2xl">
        <div class="flex justify-between items-center border-b border-white/10 pb-3">
          <div>
            <span class="font-extrabold text-indigo-400 block text-base">Domingo 1 de Noviembre</span>
            <span class="text-xs text-slate-400">Reunión Principal</span>
          </div>
          <button onclick="openEditModal()" class="text-xs bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white px-3.5 py-1.5 rounded-xl font-bold transition shadow-md shadow-indigo-600/30 active:scale-95">
            ✏️ Editar
          </button>
        </div>

        <div class="space-y-2" id="rosterDisplay"></div>

        <div class="bg-slate-950/40 p-3.5 rounded-2xl border border-white/5 text-xs space-y-2.5">
          <div class="flex justify-between items-center">
            <p class="text-indigo-300 font-bold uppercase tracking-wider text-[11px]">Setlist Asignado:</p>
            <button onclick="openAddSongModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1 rounded-xl text-xs font-bold transition flex items-center gap-1 shadow-sm active:scale-95">
              <span>+ Agregar Canción</span>
            </button>
          </div>
          <div id="setlistDisplay" class="space-y-2"></div>
        </div>
      </div>
    </div>

    <!-- PANTALLA 2: CANCIONERO -->
    <div id="screenSongbook" class="space-y-4 hidden">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold tracking-tight text-white">Cancionero</h2>
        <div class="flex items-center space-x-2 bg-slate-900/90 border border-white/10 px-3 py-1.5 rounded-2xl shadow-lg">
          <span class="text-xs text-slate-400 font-medium">Tono:</span>
          <button onclick="transpose(-1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-white active:scale-95 transition">-</button>
          <span id="currentKey" class="w-6 text-center font-extrabold text-indigo-400">G</span>
          <button onclick="transpose(1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-white active:scale-95 transition">+</button>
        </div>
      </div>

      <div class="glass-card rounded-3xl p-5 shadow-2xl space-y-3">
        <div class="flex justify-between items-start">
          <h3 id="songTitleDisplay" class="text-lg font-bold text-white">La Bondad de Dios</h3>
          <button onclick="resetKey()" class="text-xs text-indigo-300 underline hover:text-white transition">Restablecer</button>
        </div>
        <div id="songContent" class="text-sm leading-relaxed whitespace-pre-wrap font-sans text-slate-200 pt-3 border-t border-white/10"></div>
      </div>
    </div>

  </main>

  <!-- MODAL EDITAR EQUIPO -->
  <div id="editModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900/95 border border-white/10 rounded-3xl w-full max-w-md p-5 space-y-4 shadow-2xl max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center border-b border-white/10 pb-3">
        <h3 class="font-bold text-lg text-white">Editar Integrantes</h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-white font-bold text-lg">✕</button>
      </div>
      <div id="modalRolesContainer" class="space-y-3 overflow-y-auto pr-1 flex-1"></div>
      <div class="pt-2 border-t border-white/10 flex gap-2">
        <input type="text" id="newRoleInput" placeholder="Ej: SAXO, PERCUSION..." class="bg-slate-800 border border-white/10 text-xs rounded-xl px-3 py-2 text-white flex-1 focus:outline-none focus:border-indigo-500">
        <button onclick="addNewRole()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 py-2 rounded-xl font-bold transition">+ Rol</button>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeEditModal()" class="w-1/2 bg-slate-800 text-slate-300 py-2.5 rounded-xl text-sm font-semibold transition">Cancelar</button>
        <button onclick="saveRosterChanges()" class="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-sm font-bold shadow-lg transition">Guardar</button>
      </div>
    </div>
  </div>

  <!-- MODAL AGREGAR CANCIÓN -->
  <div id="addSongModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900/95 border border-white/10 rounded-3xl w-full max-w-md p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-white/10 pb-3">
        <h3 class="font-bold text-lg text-white">Agregar Canción al Servicio</h3>
        <button onclick="closeAddSongModal()" class="text-slate-400 hover:text-white font-bold text-lg">✕</button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="text-xs font-bold text-slate-400 block mb-1">Seleccionar Canción:</label>
          <select id="songSelect" class="w-full bg-slate-800 border border-white/10 text-xs rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-indigo-500"></select>
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeAddSongModal()" class="w-1/2 bg-slate-800 text-slate-300 py-2.5 rounded-xl text-sm font-semibold transition">Cancelar</button>
        <button onclick="confirmAddSong()" class="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-sm font-bold shadow-lg transition">Agregar</button>
      </div>
    </div>
  </div>

  <!-- Navegación Inferior -->
  <nav class="fixed bottom-3 left-4 right-4 bg-slate-900/90 backdrop-blur-lg border border-white/10 py-2.5 px-6 flex justify-around items-center z-40 shadow-2xl max-w-md mx-auto rounded-3xl">
    <button onclick="switchTab('schedule')" id="navSchedule" class="flex flex-col items-center space-y-1 text-indigo-400 transition">
      <span class="text-xl">📅</span>
      <span class="text-[10px] font-semibold">Cronograma</span>
    </button>
    <button onclick="switchTab('songbook')" id="navSongbook" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-white transition">
      <span class="text-xl">📖</span>
      <span class="text-[10px] font-semibold">Cancionero</span>
    </button>
  </nav>

  <script>
    // Inyección automática del manifiesto PWA integrado en un solo archivo
    const manifestData = {
      name: "Adoración Santuario Baigorria",
      short_name: "Adoración Baigorria",
      start_url: window.location.href,
      display: "standalone",
      background_color: "#0f172a",
      theme_color: "#0f172a",
      icons: [{ src: "https://cdn-icons-png.flaticon.com/512/3076/3076753.png", sizes: "192x192", type: "image/png" }]
    };
    const stringManifest = JSON.stringify(manifestData);
    const blob = new Blob([stringManifest], { type: 'application/json' });
    document.getElementById('pwaManifest').setAttribute('href', URL.createObjectURL(blob));

    // Base de datos y funciones de la app
    const songDatabase = [
      { 
        id: 1, 
        title: "La Bondad de Dios", 
        key: "G", 
        content: "[Intro]\n[G]  [C]  [G]  [D]\n\n[Estrofa]\nTe [G]amo Dios, tu mi[C]sericordia no [G]falla\nTodos mis [Em]días, en tus [C]manos he es[D]tado\nCanta[Em]ré de la bon[C]dad de [D]Dios [G]\n\n[Coro]\nEn mi [C]vida has sido [G]bueno\nEn mi [C]vida has sido [G]fiel [D]" 
      },
      { 
        id: 2, 
        title: "Cuán Grande es Él", 
        key: "A", 
        content: "[Estrofa 1]\nSeñor mi [A]Dios, al con[D]templar los cielos\nEl fir[A]mamento y las es[E]trellas al mi[A]rar\n\n[Coro]\nMi corazón se [A]eleva a Ti [D]Señor\nCuán grande es [A]Él, cuán [E]grande es [A]Él" 
      }
    ];

    let currentSetlist = [
      { id: 1, title: "La Bondad de Dios", key: "G" }
    ];

    let teamRoster = [
      { id: 1, role: "BATERÍA", person: "Lucas P." },
      { id: 2, role: "BAJO", person: "Mateo B." },
      { id: 3, role: "GUITARRAS", person: "Franco M." },
      { id: 4, role: "TECLADO", person: "Samuel R." },
      { id: 5, role: "VOZ 1", person: "Marcos G." },
      { id: 6, role: "VOZ 2", person: "Sofía T." },
      { id: 7, role: "VOZ 3", person: "Agustina R." },
      { id: 8, role: "ACÚSTICA", person: "Gabriel C." }
    ];

    function renderRosterDisplay() {
      const container = document.getElementById('rosterDisplay');
      container.innerHTML = teamRoster.map(item => `
        <div class="flex justify-between items-center bg-slate-900/50 px-3.5 py-2 rounded-2xl border border-white/5 text-sm">
          <span class="text-xs font-bold text-indigo-300 uppercase tracking-wider">${item.role}</span>
          <span class="${item.person ? 'text-slate-100 font-semibold' : 'text-slate-500 italic text-xs'}">${item.person || 'Sin asignar'}</span>
        </div>
      `).join('');
    }

    function renderSetlistDisplay() {
      const container = document.getElementById('setlistDisplay');
      container.innerHTML = currentSetlist.map((song, idx) => `
        <div class="flex justify-between items-center bg-slate-800/80 px-3 py-2 rounded-xl border border-white/5">
          <span class="text-slate-200 font-medium">${idx + 1}. ${song.title}</span>
          <div class="flex items-center gap-2">
            <span class="text-indigo-300 font-mono text-[11px] bg-indigo-500/20 px-2 py-0.5 rounded-lg border border-indigo-500/30">Tono: ${song.key}</span>
            <button onclick="removeSongFromSetlist(${idx})" class="text-red-400 text-xs font-bold px-1 hover:text-red-300">✕</button>
          </div>
        </div>
      `).join('');
    }

    function openAddSongModal() {
      const select = document.getElementById('songSelect');
      select.innerHTML = songDatabase.map(s => `<option value="${s.id}">${s.title} (Tono: ${s.key})</option>`).join('');
      document.getElementById('addSongModal').classList.remove('hidden');
    }

    function closeAddSongModal() {
      document.getElementById('addSongModal').classList.add('hidden');
    }

    function confirmAddSong() {
      const id = parseInt(document.getElementById('songSelect').value);
      const song = songDatabase.find(s => s.id === id);
      if (song) {
        currentSetlist.push({ id: song.id, title: song.title, key: song.key });
        renderSetlistDisplay();
      }
      closeAddSongModal();
    }

    function removeSongFromSetlist(idx) {
      currentSetlist.splice(idx, 1);
      renderSetlistDisplay();
    }

    function openEditModal() {
      const container = document.getElementById('modalRolesContainer');
      container.innerHTML = teamRoster.map((item, index) => `
        <div class="bg-slate-800/90 p-3 rounded-2xl border border-white/5 space-y-1.5">
          <div class="flex justify-between items-center">
            <label class="text-[11px] font-bold text-indigo-300 tracking-wider">${item.role}</label>
            <button onclick="removeRole(${index})" class="text-xs text-red-400 hover:text-red-300">Quitar</button>
          </div>
          <input type="text" id="roleInput_${index}" value="${item.person}" placeholder="Nombre..." class="w-full bg-slate-950 border border-white/10 text-xs rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
        </div>
      `).join('');
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    function saveRosterChanges() {
      teamRoster.forEach((item, index) => {
        const input = document.getElementById(`roleInput_${index}`);
        if (input) item.person = input.value.trim();
      });
      renderRosterDisplay();
      closeEditModal();
    }

    function addNewRole() {
      const input = document.getElementById('newRoleInput');
      const roleName = input.value.trim().toUpperCase();
      if (roleName) {
        teamRoster.push({ id: Date.now(), role: roleName, person: "" });
        input.value = "";
        openEditModal();
      }
    }

    function removeRole(index) {
      teamRoster.splice(index, 1);
      openEditModal();
    }

    function switchTab(tab) {
      document.getElementById('screenSchedule').classList.add('hidden');
      document.getElementById('screenSongbook').classList.add('hidden');
      document.getElementById('navSchedule').className = "flex flex-col items-center space-y-1 text-slate-400 transition";
      document.getElementById('navSongbook').className = "flex flex-col items-center space-y-1 text-slate-400 transition";

      if (tab === 'schedule') {
        document.getElementById('screenSchedule').classList.remove('hidden');
        document.getElementById('navSchedule').className = "flex flex-col items-center space-y-1 text-indigo-400 transition";
        document.getElementById('headerTitle').innerText = "Cronograma";
      } else if (tab === 'songbook') {
        document.getElementById('screenSongbook').classList.remove('hidden');
        document.getElementById('navSongbook').className = "flex flex-col items-center space-y-1 text-indigo-400 transition";
        document.getElementById('headerTitle').innerText = "Cancionero";
      }
    }

    const scale = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    let currentKeyIndex = scale.indexOf("G");
    const originalKeyIndex = currentKeyIndex;

    function transposeNote(note, semitones) {
      let base = note.replace(/m|7|maj7/g, "");
      let suffix = note.substring(base.length);
      let idx = scale.indexOf(base);
      if (idx === -1) return note;
      let newIdx = (idx + semitones + 12) % 12;
      return scale[newIdx] + suffix;
    }

    function renderSong() {
      const semitones = currentKeyIndex - originalKeyIndex;
      document.getElementById('currentKey').innerText = scale[currentKeyIndex];
      const song = songDatabase[0];

      const parsed = song.content.replace(/\[(.*?)\]/g, (match, chord) => {
        return `<span class="chord">[${transposeNote(chord, semitones)}]</span>`;
      });

      document.getElementById('songContent').innerHTML = parsed;
    }

    function transpose(delta) {
      currentKeyIndex = (currentKeyIndex + delta + 12) % 12;
      renderSong();
    }

    function resetKey() {
      currentKeyIndex = originalKeyIndex;
      renderSong();
    }

    renderRosterDisplay();
    renderSetlistDisplay();
    renderSong();
  </script>
</body>
</html>
